<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phrasal verbs jeopardy — JAC's Class</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #faf6ec;
    --bg-tint: #f4eed8;
    --surface: #ffffff;
    --ink: #15263a;
    --ink-soft: #4a5a6f;
    --muted: #8a8676;
    --border: #d5cfb8;
    --border-soft: #ece6d0;
    --accent: #c84a2c;
    --teal: #0e7c66;
  }

  html, body {
    font-family: 'Hanken Grotesk', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 920px;
    margin: 0 auto;
    padding: 36px 20px 56px;
  }

  /* HEADER */
  header {
    text-align: center;
    margin-bottom: 32px;
  }

  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-size: clamp(1.8rem, 4.5vw, 2.4rem);
    font-weight: 500;
    line-height: 1.15;
    color: var(--ink);
  }

  .subtitle {
    font-size: 1rem;
    color: var(--ink-soft);
    margin-top: 8px;
    max-width: 560px;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.5;
  }

  /* SCOREBOARD */
  .scoreboard {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 24px;
  }

  .team {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .team-info {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 0;
  }

  .team-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .team-1 .team-dot { background: var(--accent); }
  .team-2 .team-dot { background: var(--teal); }

  .team-name {
    font-family: 'Hanken Grotesk', sans-serif;
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--ink);
    background: transparent;
    border: none;
    outline: none;
    width: 100%;
    padding: 2px 0;
    border-bottom: 1px dashed transparent;
  }

  .team-name:focus, .team-name:hover {
    border-bottom-color: var(--border);
  }

  .team-score-box {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .score-btn {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink-soft);
    font-size: 0.95rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
    line-height: 1;
  }

  .score-btn:hover {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--bg);
  }

  .team-score {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 1.4rem;
    font-weight: 500;
    color: var(--ink);
    min-width: 50px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  /* BOARD */
  .board {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
  }

  .category-cell {
    padding: 18px 10px;
    text-align: center;
    font-family: 'Hanken Grotesk', sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ink);
    background: var(--bg-tint);
    border-bottom: 1px solid var(--border);
    line-height: 1.2;
    min-height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .category-cell:not(:nth-child(5)) {
    border-right: 1px solid var(--border);
  }

  .clue-cell {
    background: var(--surface);
    border: none;
    border-bottom: 1px solid var(--border-soft);
    padding: 22px 10px;
    font-family: 'Fraunces', Georgia, serif;
    font-size: 1.4rem;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.15s ease;
    min-height: 72px;
    font-variant-numeric: tabular-nums;
  }

  .clue-cell:not(:nth-child(5n)) {
    border-right: 1px solid var(--border-soft);
  }

  .clue-cell:nth-last-child(-n+5) {
    border-bottom: none;
  }

  .clue-cell:not(.used):hover {
    background: var(--bg);
    color: var(--accent);
  }

  .clue-cell.used {
    color: var(--border);
    cursor: default;
    background: var(--bg);
    text-decoration: line-through;
    text-decoration-color: var(--border);
  }

  /* ACTIONS */
  .actions {
    text-align: center;
    margin-top: 20px;
  }

  .reset-btn {
    font-family: 'Hanken Grotesk', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--muted);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 8px 12px;
    text-decoration: underline;
    text-decoration-color: var(--border);
    text-underline-offset: 4px;
    transition: color 0.15s ease;
  }

  .reset-btn:hover {
    color: var(--ink);
    text-decoration-color: var(--ink);
  }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 38, 58, 0.45);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
    animation: fadeIn 0.2s ease;
  }

  .modal-overlay.active { display: flex; }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .modal {
    background: var(--surface);
    border-radius: 16px;
    max-width: 580px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    padding: 36px 28px 28px;
    border: 1px solid var(--border);
    animation: slideUp 0.3s cubic-bezier(0.34, 1.4, 0.64, 1);
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .modal-meta {
    text-align: center;
    margin-bottom: 22px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    color: var(--muted);
    flex-wrap: wrap;
  }

  .modal-meta .dot-sep {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--border);
  }

  .modal-value { color: var(--accent); }

  .clue-text {
    font-family: 'Fraunces', Georgia, serif;
    font-size: clamp(1.3rem, 3.5vw, 1.7rem);
    font-weight: 400;
    font-style: italic;
    line-height: 1.4;
    color: var(--ink);
    text-align: center;
    margin-bottom: 32px;
    max-width: 460px;
    margin-left: auto;
    margin-right: auto;
  }

  .reveal-wrapper { text-align: center; }

  .btn {
    font-family: 'Hanken Grotesk', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    padding: 12px 28px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s ease;
    border: 1px solid;
    line-height: 1.3;
  }

  .btn-primary {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }

  .btn-primary:hover {
    background: var(--accent);
    border-color: var(--accent);
  }

  /* ANSWER */
  .answer-block { display: none; text-align: center; }
  .answer-block.visible {
    display: block;
    animation: revealFade 0.3s ease;
  }

  @keyframes revealFade {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .answer-text {
    font-family: 'Fraunces', Georgia, serif;
    font-size: clamp(1.7rem, 4.5vw, 2.1rem);
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 14px;
    letter-spacing: -0.01em;
  }

  .answer-example {
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic;
    font-size: 1rem;
    color: var(--ink-soft);
    line-height: 1.55;
    padding: 14px 16px;
    background: var(--bg);
    border-radius: 10px;
    margin-bottom: 26px;
    border: 1px solid var(--border-soft);
    text-align: left;
  }

  .answer-example::before {
    content: '\201C';
    color: var(--muted);
    margin-right: 1px;
  }

  .answer-example::after {
    content: '\201D';
    color: var(--muted);
    margin-left: 1px;
  }

  .award-label {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .award-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 8px;
  }

  .award-btn {
    font-family: 'Hanken Grotesk', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.15s ease;
    background: var(--surface);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .award-btn:hover {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }

  .award-btn::before {
    content: '';
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .award-btn-1::before { background: var(--accent); }
  .award-btn-2::before { background: var(--teal); }

  .skip-btn {
    display: block;
    margin: 8px auto 0;
    font-family: 'Hanken Grotesk', sans-serif;
    font-size: 0.8rem;
    color: var(--muted);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 6px 12px;
    text-decoration: underline;
    text-decoration-color: var(--border);
    text-underline-offset: 3px;
  }

  .skip-btn:hover {
    color: var(--ink);
    text-decoration-color: var(--ink);
  }

  /* MOBILE */
  @media (max-width: 640px) {
    .wrap { padding: 24px 14px 40px; }
    header { margin-bottom: 22px; }
    .scoreboard { grid-template-columns: 1fr; gap: 8px; margin-bottom: 18px; }
    .team { padding: 12px 14px; }
    .team-score { font-size: 1.2rem; min-width: 40px; }
    .category-cell {
      padding: 10px 4px;
      min-height: 50px;
      font-size: 0.55rem;
      letter-spacing: 0.6px;
    }
    .clue-cell {
      padding: 14px 4px;
      font-size: 0.95rem;
      min-height: 56px;
    }
    .modal { padding: 26px 20px 22px; }
    .award-buttons { grid-template-columns: 1fr; }
  }

  @media print {
    .modal-overlay, .reset-btn, .actions { display: none !important; }
    body { background: white; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <h1>Phrasal verbs jeopardy</h1>
    <p class="subtitle">B1 / B2 · Two teams. Twenty-five clues across five categories. Click a value, read the clue, reveal the answer, award the points.</p>
  </header>

  <div class="scoreboard">
    <div class="team team-1">
      <div class="team-info">
        <span class="team-dot" aria-hidden="true"></span>
        <input class="team-name" type="text" value="Red Team" maxlength="20" aria-label="Team 1 name">
      </div>
      <div class="team-score-box">
        <button class="score-btn" onclick="adjustScore(0, -100)" aria-label="Subtract 100 from Team 1">&minus;</button>
        <div class="team-score" id="score-1">0</div>
        <button class="score-btn" onclick="adjustScore(0, 100)" aria-label="Add 100 to Team 1">+</button>
      </div>
    </div>
    <div class="team team-2">
      <div class="team-info">
        <span class="team-dot" aria-hidden="true"></span>
        <input class="team-name" type="text" value="Green Team" maxlength="20" aria-label="Team 2 name">
      </div>
      <div class="team-score-box">
        <button class="score-btn" onclick="adjustScore(1, -100)" aria-label="Subtract 100 from Team 2">&minus;</button>
        <div class="team-score" id="score-2">0</div>
        <button class="score-btn" onclick="adjustScore(1, 100)" aria-label="Add 100 to Team 2">+</button>
      </div>
    </div>
  </div>

  <div class="board" id="board"></div>

  <div class="actions">
    <button class="reset-btn" onclick="resetGame()">Start a new game</button>
  </div>

</div>

<!-- Modal -->
<div class="modal-overlay" id="modal" onclick="if(event.target === this) closeModal()">
  <div class="modal">
    <div class="modal-meta">
      <span id="modal-category">Category</span>
      <span class="dot-sep" aria-hidden="true"></span>
      <span class="modal-value" id="modal-value">100</span>
    </div>

    <div class="clue-text" id="modal-clue">&mdash;</div>

    <div class="reveal-wrapper" id="reveal-wrapper">
      <button class="btn btn-primary" id="reveal-btn" onclick="revealAnswer()">Reveal answer</button>
    </div>

    <div class="answer-block" id="answer-block">
      <div class="answer-text" id="modal-answer">&mdash;</div>
      <div class="answer-example" id="modal-example">&mdash;</div>

      <div class="award-label">Who got it?</div>
      <div class="award-buttons">
        <button class="award-btn award-btn-1" onclick="award(0)" id="award-btn-1">Red Team</button>
        <button class="award-btn award-btn-2" onclick="award(1)" id="award-btn-2">Green Team</button>
      </div>
      <button class="skip-btn" onclick="closeModal(true)">No team got it</button>
    </div>
  </div>
</div>

<script>
  const data = {
    categories: [
      {
        name: 'Work & Business',
        clues: [
          { value: 100, clue: 'To perform or complete a task or instruction.', answer: 'CARRY OUT', example: 'We need to carry out a survey before the launch.' },
          { value: 200, clue: 'To delay or postpone something to a later time.', answer: 'PUT OFF', example: 'Can we put off the meeting until next week?' },
          { value: 300, clue: 'To submit work to a teacher, manager or authority.', answer: 'HAND IN', example: 'Please hand in your reports by Friday.' },
          { value: 400, clue: 'To think of or invent a new idea, plan or solution.', answer: 'COME UP WITH', example: 'She came up with a brilliant solution to the problem.' },
          { value: 500, clue: 'To investigate or examine something carefully.', answer: 'LOOK INTO', example: 'We are looking into the customer\u2019s complaint.' }
        ]
      },
      {
        name: 'Relationships',
        clues: [
          { value: 100, clue: 'To end a romantic relationship.', answer: 'BREAK UP', example: 'They broke up after three years together.' },
          { value: 200, clue: 'To have a friendly relationship with someone.', answer: 'GET ALONG', example: 'I get along well with most of my colleagues.' },
          { value: 300, clue: 'To meet someone unexpectedly.', answer: 'RUN INTO', example: 'I ran into an old friend at the supermarket yesterday.' },
          { value: 400, clue: 'To support someone, especially during a difficult time.', answer: 'STAND BY', example: 'His family stood by him through the whole ordeal.' },
          { value: 500, clue: 'To admire and respect someone, often someone older or more experienced.', answer: 'LOOK UP TO', example: 'She really looks up to her older sister.' }
        ]
      },
      {
        name: 'Travel & Movement',
        clues: [
          { value: 100, clue: 'When a plane leaves the ground.', answer: 'TAKE OFF', example: 'Our flight takes off at 8 a.m.' },
          { value: 200, clue: 'To register your arrival at a hotel or airport.', answer: 'CHECK IN', example: 'We checked in at the hotel just before three.' },
          { value: 300, clue: 'To visit somewhere briefly, often without arrangement.', answer: 'DROP BY', example: 'I\u2019ll drop by your office on my way home.' },
          { value: 400, clue: 'To arrive somewhere, often unexpectedly or late.', answer: 'TURN UP', example: 'He turned up an hour late, with no apology.' },
          { value: 500, clue: 'To accept a difficult past event and continue with life.', answer: 'MOVE ON', example: 'It\u2019s time to move on from that mistake.' }
        ]
      },
      {
        name: 'Daily Life',
        clues: [
          { value: 100, clue: 'To leave your bed in the morning.', answer: 'GET UP', example: 'I get up at seven every day.' },
          { value: 200, clue: 'To put clothes on briefly to test if they fit.', answer: 'TRY ON', example: 'Can I try on these jeans, please?' },
          { value: 300, clue: 'To find or discover something or someone by chance.', answer: 'COME ACROSS', example: 'I came across an old photo album in the attic.' },
          { value: 400, clue: 'To stop trying or stop doing something.', answer: 'GIVE UP', example: 'Don\u2019t give up \u2014 you\u2019re almost there.' },
          { value: 500, clue: 'To clean and organise a room or space.', answer: 'TIDY UP', example: 'Please tidy up the kitchen before our guests arrive.' }
        ]
      },
      {
        name: 'Emotions',
        clues: [
          { value: 100, clue: 'To become happier or more cheerful.', answer: 'CHEER UP', example: 'Cheer up \u2014 it\u2019s not the end of the world.' },
          { value: 200, clue: 'To suddenly become very angry.', answer: 'BLOW UP', example: 'She blew up when she heard what he had done.' },
          { value: 300, clue: 'To recover from a difficult experience or illness.', answer: 'GET OVER', example: 'It took him months to get over the breakup.' },
          { value: 400, clue: 'To feel pleased and excited about something in the future.', answer: 'LOOK FORWARD TO', example: 'I\u2019m really looking forward to the holidays.' },
          { value: 500, clue: 'To suppress or hide your emotions instead of expressing them.', answer: 'BOTTLE UP', example: 'Don\u2019t bottle up your feelings \u2014 talk to someone.' }
        ]
      }
    ],
    teams: [{ name: 'Red Team', score: 0 }, { name: 'Green Team', score: 0 }],
    used: new Set(),
    currentClue: null
  };

  function buildBoard() {
    const board = document.getElementById('board');
    board.innerHTML = '';
    data.categories.forEach(cat => {
      const cell = document.createElement('div');
      cell.className = 'category-cell';
      cell.textContent = cat.name;
      board.appendChild(cell);
    });
    for (let row = 0; row < 5; row++) {
      data.categories.forEach((cat, catIdx) => {
        const clue = cat.clues[row];
        const cellId = catIdx + '-' + row;
        const cell = document.createElement('button');
        cell.className = 'clue-cell';
        cell.textContent = clue.value;
        cell.dataset.id = cellId;
        if (data.used.has(cellId)) cell.classList.add('used');
        cell.addEventListener('click', () => {
          if (!data.used.has(cellId)) openClue(catIdx, row);
        });
        board.appendChild(cell);
      });
    }
  }

  function openClue(catIdx, clueIdx) {
    const cat = data.categories[catIdx];
    const clue = cat.clues[clueIdx];
    data.currentClue = { catIdx, clueIdx, value: clue.value };
    document.getElementById('modal-category').textContent = cat.name;
    document.getElementById('modal-value').textContent = clue.value;
    document.getElementById('modal-clue').textContent = clue.clue;
    document.getElementById('modal-answer').textContent = clue.answer;
    document.getElementById('modal-example').textContent = clue.example;
    document.getElementById('reveal-wrapper').style.display = 'block';
    document.getElementById('answer-block').classList.remove('visible');
    document.getElementById('award-btn-1').lastChild.textContent = ' ' + data.teams[0].name;
    document.getElementById('award-btn-2').lastChild.textContent = ' ' + data.teams[1].name;
    document.getElementById('modal').classList.add('active');
  }

  function revealAnswer() {
    document.getElementById('reveal-wrapper').style.display = 'none';
    document.getElementById('answer-block').classList.add('visible');
  }

  function award(teamIdx) {
    if (!data.currentClue) return;
    data.teams[teamIdx].score += data.currentClue.value;
    updateScores();
    markUsed();
    closeModal();
  }

  function closeModal(skipAndMark) {
    if (skipAndMark) markUsed();
    document.getElementById('modal').classList.remove('active');
    data.currentClue = null;
  }

  function markUsed() {
    if (!data.currentClue) return;
    const cellId = data.currentClue.catIdx + '-' + data.currentClue.clueIdx;
    data.used.add(cellId);
    const cell = document.querySelector('[data-id="' + cellId + '"]');
    if (cell) cell.classList.add('used');
  }

  function updateScores() {
    document.getElementById('score-1').textContent = data.teams[0].score;
    document.getElementById('score-2').textContent = data.teams[1].score;
  }

  function adjustScore(teamIdx, delta) {
    data.teams[teamIdx].score += delta;
    updateScores();
  }

  function resetGame() {
    if (data.used.size > 0 && !confirm('Start a new game? All scores and used clues will be reset.')) return;
    data.teams[0].score = 0;
    data.teams[1].score = 0;
    data.used.clear();
    updateScores();
    buildBoard();
  }

  document.querySelectorAll('.team-name').forEach((input, idx) => {
    input.addEventListener('input', e => {
      data.teams[idx].name = e.target.value || ('Team ' + (idx + 1));
    });
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });

  buildBoard();
  updateScores();
</script>

</body>
</html>
