<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Pronunciation Battle — FR vs EN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #faf6ec;
  --card: #ffffff;
  --border: #d5cfb8;
  --border-soft: #e7e1cc;
  --navy: #15263a;
  --navy-soft: #2b3a4f;
  --muted: #6b7384;
  --terracotta: #c84a2c;
  --terracotta-soft: #e89478;
  --teal: #0e7c66;
  --teal-soft: #7fb6a5;
  --shadow: 0 1px 2px rgba(21,38,58,0.04), 0 4px 16px rgba(21,38,58,0.06);
  --fr-accent: #2b4acb;
  --en-accent: #c84a2c;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--cream);
  color: var(--navy);
  font-family: 'Hanken Grotesk', sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

body {
  min-height: 100vh;
  padding: 24px 16px 60px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.container { width: 100%; max-width: 560px; }

.header { text-align: center; margin-bottom: 28px; }

.header h1 {
  font-family: 'Fraunces', serif;
  font-size: 1.75rem;
  font-weight: 600;
  color: var(--navy);
  letter-spacing: -0.02em;
  margin-bottom: 4px;
}

.header .subtitle {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-weight: 400;
  color: var(--muted);
  font-size: 0.9rem;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}

.card.fr-border { border-left: 4px solid var(--fr-accent); }
.card.en-border { border-left: 4px solid var(--en-accent); }

.setup-row {
  display: flex;
  gap: 12px;
  margin-bottom: 16px;
}

.setup-row label {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.setup-row input {
  font-family: 'Hanken Grotesk', sans-serif;
  font-size: 1rem;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--cream);
  color: var(--navy);
  outline: none;
  transition: border-color 0.2s;
}

.setup-row input:focus { border-color: var(--navy); }

.btn {
  font-family: 'Hanken Grotesk', sans-serif;
  font-size: 0.95rem;
  font-weight: 600;
  padding: 12px 24px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  width: 100%;
}

.btn-primary { background: var(--navy); color: var(--cream); }
.btn-primary:hover { background: var(--terracotta); }

.btn-reveal {
  background: var(--cream);
  color: var(--navy);
  border: 2px solid var(--navy);
}
.btn-reveal:hover { background: var(--navy); color: var(--cream); }

.btn-row { display: flex; gap: 8px; margin-top: 16px; }
.btn-row .btn { flex: 1; padding: 12px 8px; font-size: 0.85rem; }

.btn-correct { background: var(--teal); color: #fff; }
.btn-correct:hover { opacity: 0.85; }

.btn-wrong { background: var(--cream); color: var(--navy); border: 1px solid var(--border); }
.btn-wrong:hover { border-color: var(--navy); }

.scoreboard {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 12px;
  align-items: center;
  margin-bottom: 20px;
}

.player-card { text-align: center; padding: 12px; background: var(--cream); border-radius: 10px; }
.player-card.hot { outline: 2px solid var(--navy); outline-offset: -2px; }

.player-name {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 2px;
}

.player-score-num {
  font-family: 'Fraunces', serif;
  font-size: 2rem;
  font-weight: 700;
}

.fr-color { color: var(--fr-accent); }
.en-color { color: var(--en-accent); }

.vs-label {
  font-family: 'Fraunces', serif;
  font-style: italic;
  color: var(--muted);
  font-size: 0.9rem;
}

.progress-wrap {
  background: var(--border-soft);
  border-radius: 100px;
  height: 6px;
  margin-bottom: 6px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  border-radius: 100px;
  transition: width 0.4s ease;
}

.progress-fill.fr-fill { background: var(--fr-accent); }
.progress-fill.en-fill { background: var(--en-accent); }

.round-label {
  text-align: center;
  font-size: 0.8rem;
  color: var(--muted);
  margin-bottom: 16px;
}

.turn-banner {
  text-align: center;
  padding: 10px 16px;
  border-radius: 8px;
  font-size: 0.9rem;
  margin-bottom: 16px;
}

.turn-banner.fr-turn { background: rgba(43,74,203,0.08); color: var(--fr-accent); }
.turn-banner.en-turn { background: rgba(200,74,44,0.08); color: var(--en-accent); }

.lang-badge {
  display: inline-block;
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 3px 10px;
  border-radius: 100px;
  margin-bottom: 8px;
}

.lang-badge.english { background: rgba(200,74,44,0.1); color: var(--en-accent); }
.lang-badge.french { background: rgba(43,74,203,0.1); color: var(--fr-accent); }

.diff-dot {
  display: inline-block;
  font-size: 0.65rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 2px 8px;
  border-radius: 100px;
  margin-left: 6px;
}

.diff-dot.medium { background: #e8f5e9; color: var(--teal); }
.diff-dot.hard { background: #fff3e0; color: #bf6c00; }
.diff-dot.evil { background: #fce4ec; color: var(--terracotta); }

.the-word {
  font-family: 'Fraunces', serif;
  font-size: 2.2rem;
  font-weight: 700;
  color: var(--navy);
  text-align: center;
  margin-bottom: 4px;
  animation: wordIn 0.35s ease-out;
}

@keyframes wordIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.meaning-text {
  text-align: center;
  font-style: italic;
  color: var(--muted);
  font-size: 0.85rem;
  margin-bottom: 4px;
}

.hint-text {
  font-family: 'Fraunces', serif;
  font-style: italic;
  color: var(--muted);
  text-align: center;
  font-size: 0.9rem;
  margin-bottom: 16px;
}

.ipa-box {
  background: var(--cream);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  text-align: center;
  margin-top: 12px;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.ipa-text {
  font-size: 1.3rem;
  font-weight: 600;
  color: var(--teal);
  margin-bottom: 6px;
}

.note-text { font-size: 0.85rem; color: var(--navy-soft); line-height: 1.4; }

.game-over { text-align: center; }

.game-over h2 {
  font-family: 'Fraunces', serif;
  font-size: 1.5rem;
  font-weight: 600;
  margin-bottom: 4px;
}

.winner-text {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 1.1rem;
  color: var(--muted);
  margin-bottom: 20px;
}

.final-scores { display: flex; justify-content: center; gap: 32px; margin-bottom: 24px; }
.final-item { text-align: center; }
.final-name { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 2px; }
.final-num { font-family: 'Fraunces', serif; font-size: 2.4rem; font-weight: 700; }

@media (max-width: 400px) {
  .the-word { font-size: 1.7rem; }
  .btn-row .btn { font-size: 0.78rem; padding: 10px 4px; }
  .setup-row { flex-direction: column; }
}
</style>
</head>
<body>
<div class="container" id="app"></div>

<script>
const EN_WORDS = {
  medium: [
    { word: "comfortable", ipa: "/ˈkʌmf.tə.bəl/", note: "Three syllables in natural speech. KUMF-tuh-bul.", hint: "How many syllables does this really have?" },
    { word: "Wednesday", ipa: "/ˈwenz.deɪ/", note: "The first 'd' is silent — WENZ-day.", hint: "A day with a silent letter" },
    { word: "iron", ipa: "/ˈaɪ.ən/", note: "Two syllables — EYE-un. The 'r' isn't pronounced.", hint: "The 'r' plays tricks" },
    { word: "receipt", ipa: "/rɪˈsiːt/", note: "The 'p' is silent.", hint: "A letter is hiding" },
    { word: "breakfast", ipa: "/ˈbrek.fəst/", note: "Short 'e' as in 'bed', not 'ee'.", hint: "Think about what this word is made of" },
    { word: "mortgage", ipa: "/ˈmɔː.ɡɪdʒ/", note: "The 't' is silent — MOR-gij.", hint: "A silent letter lurks" },
    { word: "clothes", ipa: "/kləʊðz/", note: "One syllable! Rhymes with 'close' (the verb).", hint: "How many syllables?" },
    { word: "temperature", ipa: "/ˈtem.prə.tʃər/", note: "Three syllables in natural speech, not four.", hint: "Natives drop a syllable" },
  ],
  hard: [
    { word: "thoroughly", ipa: "/ˈθʌr.ə.li/", note: "Starts with 'th' /θ/, has the 'uh' vowel, 'ough' = /ə/.", hint: "Three tricky sounds in one word" },
    { word: "colonel", ipa: "/ˈkɜː.nəl/", note: "Pronounced KER-nul — nothing like the spelling!", hint: "The spelling is a total lie" },
    { word: "queue", ipa: "/kjuː/", note: "Only the first letter is actually pronounced!", hint: "Most of this word is silent" },
    { word: "eighth", ipa: "/eɪtθ/", note: "One syllable! ATE + th. Brutal consonant cluster.", hint: "A one-syllable nightmare" },
    { word: "architecture", ipa: "/ˈɑː.kɪ.tek.tʃər/", note: "Hard 'k' sound, not 'sh'. Four syllables.", hint: "The 'ch' isn't French" },
    { word: "draught", ipa: "/drɑːft/", note: "Sounds like 'draft'.", hint: "Think of a cold breeze" },
    { word: "entrepreneur", ipa: "/ˌɒn.trə.prəˈnɜːr/", note: "English stress on the LAST syllable, unlike French.", hint: "Same word, different stress" },
  ],
  evil: [
    { word: "Worcestershire", ipa: "/ˈwʊs.tə.ʃər/", note: "Only three syllables! WUSS-tuh-shur.", hint: "A famous sauce" },
    { word: "squirrel", ipa: "/ˈskwɪr.əl/", note: "Two syllables with that 'skw' cluster.", hint: "A French person's nemesis" },
    { word: "synecdoche", ipa: "/sɪˈnek.də.ki/", note: "Ends in 'kee', not 'coach'.", hint: "A literary term — Greek ending" },
    { word: "chthonic", ipa: "/ˈθɒn.ɪk/", note: "Both 'c' and 'h' are silent! Starts with 'th'.", hint: "Two silent letters at the start" },
    { word: "otorhinolaryngologist", ipa: "/ˌɒt.əʊ.raɪ.nəʊ.læ.rɪŋˈɡɒl.ə.dʒɪst/", note: "An ear, nose & throat doctor. Ten syllables.", hint: "A medical specialist" },
  ]
};

const FR_WORDS = {
  medium: [
    { word: "écureuil", ipa: "/e.ky.ʁœj/", meaning: "squirrel", note: "Three syllables: ay-kü-RŒY. The 'euil' ending is a French classic.", hint: "The French 'squirrel'" },
    { word: "grenouille", ipa: "/ɡʁə.nuj/", meaning: "frog", note: "Gruh-NOOY. The 'ouille' makes a 'ooy' sound.", hint: "The 'ouille' ending…" },
    { word: "feuille", ipa: "/fœj/", meaning: "leaf", note: "One syllable! FŒY. Not 'few-eel'.", hint: "Just one syllable" },
    { word: "serrurerie", ipa: "/sɛ.ʁy.ʁə.ʁi/", meaning: "locksmith's shop", note: "Four syllables, three French 'r' sounds.", hint: "Three French 'r' sounds!" },
    { word: "heureux", ipa: "/ø.ʁø/", meaning: "happy", note: "Both vowels use 'eu' /ø/ — a sound English doesn't have.", hint: "A vowel English doesn't have" },
    { word: "oreiller", ipa: "/ɔ.ʁɛ.je/", meaning: "pillow", note: "Oh-ray-YAY. The double 'l' becomes a 'y' sound.", hint: "The 'll' isn't what you expect" },
    { word: "yaourt", ipa: "/ja.uʁt/", meaning: "yoghurt", note: "YA-oort. Even French people argue about this one!", hint: "Even natives disagree" },
    { word: "oignon", ipa: "/ɔ.ɲɔ̃/", meaning: "onion", note: "Oh-NYOHN. The 'oi' is NOT 'wa' here — exception!", hint: "An exception to the 'oi' rule" },
  ],
  hard: [
    { word: "anticonstitutionnellement", ipa: "/ɑ̃.ti.kɔ̃s.ti.ty.sjɔ.nɛl.mɑ̃/", meaning: "unconstitutionally", note: "Eight syllables with nasals everywhere.", hint: "France's longest common word" },
    { word: "accueillir", ipa: "/a.kœ.jiʁ/", meaning: "to welcome", note: "Ah-kuh-YEER. The 'cueil' is the trap.", hint: "The 'cueil' is deadly" },
    { word: "bouilloire", ipa: "/bu.jwɑʁ/", meaning: "kettle", note: "Boo-YWAR. The 'ouill' makes a glide into 'war'.", hint: "That 'ouill' combination" },
    { word: "quincaillerie", ipa: "/kɛ̃.kɑj.ʁi/", meaning: "hardware store", note: "Kan-KAI-ree. A nasal 'in' and that 'aille' = 'ai'.", hint: "Nasals + 'aille' ending" },
    { word: "vraisemblablement", ipa: "/vʁɛ.sɑ̃.bla.blə.mɑ̃/", meaning: "likely / presumably", note: "VRAY-sahm-blah-bluh-MAHN. Five syllables + two nasals.", hint: "Consonant clusters galore" },
    { word: "aujourd'hui", ipa: "/o.ʒuʁ.dɥi/", meaning: "today", note: "Oh-zhoor-DWEE. Three words collapsed into one.", hint: "Three words in disguise" },
    { word: "ail", ipa: "/aj/", meaning: "garlic", note: "Rhymes with 'eye'. One syllable. The 'l' is part of the vowel.", hint: "One tiny syllable" },
  ],
  evil: [
    { word: "Schaerbeek", ipa: "/skaʁ.bek/", meaning: "a Brussels commune", note: "SKAR-bek. The 'sch' is /sk/ in Belgian French.", hint: "Belgian geography" },
    { word: "chrysanthème", ipa: "/kʁi.zɑ̃.tɛm/", meaning: "chrysanthemum", note: "Kree-zahn-TEM. Even French people hesitate.", hint: "Flower + Greek spelling" },
    { word: "Auxerre", ipa: "/o.sɛʁ/", meaning: "a city in Burgundy", note: "Oh-SAIR. The 'x' is silent!", hint: "Geography with a silent 'x'" },
    { word: "oeil", ipa: "/œj/", meaning: "eye", note: "Just one syllable: ŒY. Nothing like the spelling suggests.", hint: "Three letters, one sound" },
    { word: "succinct", ipa: "/syk.sɛ̃/", meaning: "succinct", note: "Sük-SAN. The 'ct' is silent in French!", hint: "Silent ending in French" },
  ]
};

function shuffle(a) { const b = [...a]; for (let i = b.length-1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }

function buildWordList() {
  const en = shuffle([...EN_WORDS.medium, ...EN_WORDS.hard, ...EN_WORDS.evil]);
  const fr = shuffle([...FR_WORDS.medium, ...FR_WORDS.hard, ...FR_WORDS.evil]);
  const list = [];
  const max = Math.max(en.length, fr.length);
  for (let i = 0; i < max; i++) {
    if (i < en.length) list.push({ ...en[i], lang: 'english' });
    if (i < fr.length) list.push({ ...fr[i], lang: 'french' });
  }
  return list;
}

function getDiffForWord(w) {
  const allSets = w.lang === 'english' ? EN_WORDS : FR_WORDS;
  if (allSets.medium.some(x => x.word === w.word)) return 'medium';
  if (allSets.hard.some(x => x.word === w.word)) return 'hard';
  return 'evil';
}

let state = { screen: 'setup', frName: '🇫🇷 French player', enName: '🇬🇧 English player' };

function startGame() {
  const fr = document.getElementById('fr').value.trim() || '🇫🇷 French player';
  const en = document.getElementById('en').value.trim() || '🇬🇧 English player';
  const words = buildWordList();
  Object.assign(state, {
    screen: 'play', frName: fr, enName: en,
    frScore: 0, enScore: 0,
    words, round: 0, revealed: false,
    currentWord: words[0]
  });
  render();
}

function reveal() { state.revealed = true; render(); }

function score(correct) {
  const w = state.currentWord;
  const isFrTurn = w.lang === 'english';
  if (correct) { if (isFrTurn) state.frScore++; else state.enScore++; }
  state.round++;
  if (state.round >= state.words.length) state.screen = 'gameover';
  else { state.currentWord = state.words[state.round]; state.revealed = false; }
  render();
}

function resetGame() { state = { screen: 'setup', frName: state.frName, enName: state.enName }; render(); }

function render() {
  const app = document.getElementById('app');

  if (state.screen === 'setup') {
    app.innerHTML = `
      <div class="header">
        <h1>🇫🇷 vs 🇬🇧</h1>
        <div class="subtitle">Pronunciation Battle — each player faces the other language</div>
      </div>
      <div class="card">
        <div class="setup-row">
          <label>🇫🇷 French player <input id="fr" type="text" value="${state.frName}" placeholder="Name"></label>
          <label>🇬🇧 English player <input id="en" type="text" value="${state.enName}" placeholder="Name"></label>
        </div>
        <p style="font-size:0.85rem;color:var(--muted);margin-bottom:16px;line-height:1.4;">
          The French player pronounces <strong>English</strong> words. The English player pronounces <strong>French</strong> words. The other player judges!
        </p>
        <button class="btn btn-primary" onclick="startGame()">Start Game</button>
      </div>`;
    return;
  }

  if (state.screen === 'gameover') {
    let winner = '';
    if (state.frScore > state.enScore) winner = `${state.frName} wins!`;
    else if (state.enScore > state.frScore) winner = `${state.enName} wins!`;
    else winner = "It's a draw!";
    app.innerHTML = `
      <div class="header"><h1>🇫🇷 vs 🇬🇧</h1></div>
      <div class="card game-over">
        <h2>Game Over</h2>
        <div class="winner-text">${winner}</div>
        <div class="final-scores">
          <div class="final-item">
            <div class="final-name fr-color">${state.frName}</div>
            <div class="final-num fr-color">${state.frScore}</div>
          </div>
          <div class="final-item">
            <div class="final-name en-color">${state.enName}</div>
            <div class="final-num en-color">${state.enScore}</div>
          </div>
        </div>
        <button class="btn btn-primary" onclick="resetGame()">Play Again</button>
      </div>`;
    return;
  }

  const w = state.currentWord;
  const isFrTurn = w.lang === 'english';
  const challengedName = isFrTurn ? state.frName : state.enName;
  const judgeName = isFrTurn ? state.enName : state.frName;
  const diff = getDiffForWord(w);
  const progress = (state.round / state.words.length) * 100;
  const turnClass = isFrTurn ? 'fr-turn' : 'en-turn';
  const borderClass = isFrTurn ? 'en-border' : 'fr-border';
  const fillClass = isFrTurn ? 'fr-fill' : 'en-fill';
  const langLabel = w.lang === 'english' ? 'English' : 'French';
  const langBadgeClass = w.lang;

  app.innerHTML = `
    <div class="header"><h1>🇫🇷 vs 🇬🇧</h1></div>
    <div class="card ${borderClass}">
      <div class="scoreboard">
        <div class="player-card ${isFrTurn ? 'hot' : ''}">
          <div class="player-name fr-color">${state.frName}</div>
          <div class="player-score-num fr-color">${state.frScore}</div>
        </div>
        <div class="vs-label">vs</div>
        <div class="player-card ${!isFrTurn ? 'hot' : ''}">
          <div class="player-name en-color">${state.enName}</div>
          <div class="player-score-num en-color">${state.enScore}</div>
        </div>
      </div>
      <div class="progress-wrap"><div class="progress-fill ${fillClass}" style="width:${progress}%"></div></div>
      <div class="round-label">Round ${state.round + 1} of ${state.words.length}</div>
      <div class="turn-banner ${turnClass}">
        <strong>${challengedName}</strong> — your turn to pronounce! (${judgeName} judges)
      </div>
      <div style="text-align:center;">
        <span class="lang-badge ${langBadgeClass}">${langLabel}</span>
        <span class="diff-dot ${diff}">${diff}</span>
      </div>
      <div class="the-word">${w.word}</div>
      ${w.meaning ? `<div class="meaning-text">"${w.meaning}"</div>` : ''}
      <div class="hint-text">${w.hint}</div>
      ${state.revealed ? `
        <div class="ipa-box">
          <div class="ipa-text">${w.ipa}</div>
          <div class="note-text">${w.note}</div>
        </div>
        <div class="btn-row">
          <button class="btn btn-correct" onclick="score(true)">✅ ${challengedName} nailed it!</button>
          <button class="btn btn-wrong" onclick="score(false)">❌ Not quite</button>
        </div>
      ` : `
        <button class="btn btn-reveal" onclick="reveal()">Reveal Pronunciation</button>
      `}
    </div>`;
}

render();
</script>
</body>
</html>
